name: validation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      fixed_benchmark:
        description: Run acceptance on a configured Linux 4 vCPU / 8 GiB / SSD runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.19'
      - run: uv sync --locked --group dev
      - run: uv run ruff check src tests tools
      - run: uv run ruff format --check src tests tools
      - run: uv run mypy src
      - run: uv run pytest -m 'not performance and not delivery' --cov=lia --cov-report=json:reports/coverage.json --junitxml=reports/junit.xml
      - run: uv run python tools/coverage_gate.py reports/coverage.json
      - run: uv run python -c "from pathlib import Path; p=Path('reports/test-outcomes.json'); p.replace('reports/test-outcomes-functional.json')"
      - run: uv run python tools/mutation_check.py
      - run: uv run lia replay --suite datasets/evaluation-v2/manifest.yml --output reports/evaluation-v2
      - run: uv run python tools/report_evaluation.py --run reports/evaluation-v2 --suite datasets/evaluation-v2/manifest.yml
      - run: uv run python tools/capture_lab.py --output reports/lab
      - run: uv build
      - run: uv run python tools/wheel_smoke.py
      - run: uv run pip-audit --skip-editable --format json --output reports/dependency-audit.json
      - run: uv run python tools/scan_secrets.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validation-${{ matrix.os }}-${{ matrix.python }}
          path: |
            reports/*.json
            reports/*.xml
            reports/evaluation-v2/summary.json
            reports/lab/lab-report.json
            dist/*
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build -t lia:test .
      - run: docker run --rm --network none --read-only --tmpfs /work:uid=10001,gid=10001 --tmpfs /tmp lia:test demo --output /work/demo
  fixed-performance:
    if: github.event_name == 'workflow_dispatch' && inputs.fixed_benchmark
    runs-on: [self-hosted, linux, lia-4vcpu-8gib-ssd]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.19'
      - run: uv sync --locked --group dev
      - run: uv run lia benchmark --profile benchmarks/standard.yml --output reports/performance/benchmark-100k-final
      - run: uv run lia benchmark --profile benchmarks/million.yml --output reports/performance/benchmark-million-final
      - run: uv run pytest -m performance
        env:
          LIA_BENCHMARK_DIR: reports/performance
          LIA_FIXED_RUNNER: linux-4vcpu-8gib-ssd
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fixed-performance
          path: reports/performance/*/benchmark.json
